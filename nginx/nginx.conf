events {
    worker_connections 1024;
}

http {
    # Seguridad general
    server_tokens off;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Logs
    access_log /var/log/nginx/sia_access.log;
    error_log  /var/log/nginx/sia_error.log;

    # Redirect HTTP → HTTPS (Desactivado para prototipo local)
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    # Prototipo local — Dashboard + API
    server {
        listen 80;
        server_name localhost;  # Ajustar al dominio real en producción

        # SSL — Certificados (generar con certbot o institucionales)
        # ssl_certificate     /etc/nginx/ssl/cert.pem;
        # ssl_certificate_key /etc/nginx/ssl/key.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers HIGH:!aNULL:!MD5;

        # Para desarrollo sin SSL, usar listen 80 en vez de 443 ssl
        # y comentar las líneas ssl_* de arriba

        # Tamaño máximo de upload (para PDFs)
        client_max_body_size 20M;

        # Dashboard + API
        location / {
            proxy_pass http://sia-app:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket (Socket.io)
        location /socket.io/ {
            proxy_pass http://sia-app:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Rate limit en login
        location /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://sia-app:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rate limit en API general
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://sia-app:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Bloquear acceso directo a Redis
        location /redis { return 403; }
    }
}
