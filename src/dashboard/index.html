<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIA Observa — Agente de Automatización</title>
  <meta name="description" content="Panel de supervisión del agente automatizado de certificados SIA Observa — Gobernación del Cauca">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-0: #06080d;
      --bg-1: #0c1017;
      --bg-2: #141a25;
      --bg-3: #1c2433;
      --bg-4: #243042;
      --bg-hover: #2a3650;
      --accent: #3b82f6;
      --accent-dim: rgba(59,130,246,0.12);
      --accent-glow: rgba(59,130,246,0.25);
      --accent-2: #8b5cf6;
      --success: #10b981;
      --success-dim: rgba(16,185,129,0.12);
      --warning: #f59e0b;
      --warning-dim: rgba(245,158,11,0.12);
      --danger: #ef4444;
      --danger-dim: rgba(239,68,68,0.12);
      --text-0: #f8fafc;
      --text-1: #e2e8f0;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --border: rgba(148,163,184,0.08);
      --border-2: rgba(148,163,184,0.15);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 16px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-0);
      color: var(--text-1);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ====== LAYOUT ====== */
    .app { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--bg-1);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 50;
      transition: var(--transition);
    }

    .sidebar-brand {
      padding: 1.5rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-brand h1 {
      font-size: 1rem;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2px;
    }

    .sidebar-brand small {
      font-size: 0.65rem;
      color: var(--text-3);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .sidebar-nav { flex: 1; padding: 0.75rem; display: flex; flex-direction: column; gap: 2px; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      color: var(--text-2);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: var(--transition);
      border: 1px solid transparent;
    }

    .nav-item:hover { background: var(--bg-3); color: var(--text-0); }
    .nav-item.active {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: rgba(59,130,246,0.2);
    }

    .nav-item .icon { font-size: 1.1rem; width: 24px; text-align: center; }

    .nav-badge {
      margin-left: auto;
      background: var(--danger);
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      min-width: 20px;
      text-align: center;
    }

    .sidebar-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      color: white;
    }

    .user-info { flex: 1; }
    .user-info .name { font-size: 0.8rem; font-weight: 600; color: var(--text-0); }
    .user-info .role { font-size: 0.65rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Main Content */
    .main { flex: 1; margin-left: 260px; }

    .topbar {
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--bg-1);
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(12px);
    }

    .topbar h2 { font-size: 1.15rem; font-weight: 600; }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--success);
      padding: 4px 12px;
      background: var(--success-dim);
      border-radius: 20px;
      border: 1px solid rgba(16,185,129,0.2);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(16,185,129,0.4); } 50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(16,185,129,0); } }

    .content { padding: 1.5rem 2rem; }

    /* ====== STATS CARDS ====== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      opacity: 0;
      transition: var(--transition);
    }

    .stat-card:hover { border-color: var(--border-2); transform: translateY(-2px); box-shadow: var(--shadow); }
    .stat-card:hover::before { opacity: 1; }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
    }

    .stat-value.blue { color: var(--accent); }
    .stat-value.green { color: var(--success); }
    .stat-value.yellow { color: var(--warning); }
    .stat-value.red { color: var(--danger); }
    .stat-value.purple { color: var(--accent-2); }

    /* ====== TABLE ====== */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .section-title { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }

    .filters { display: flex; gap: 6px; }

    .filter-btn {
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 500;
      border: 1px solid var(--border-2);
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .table-wrap {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }

    th {
      text-align: left;
      padding: 0.6rem 1rem;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-3);
      background: var(--bg-3);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 0.7rem 1rem;
      font-size: 0.82rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-2);
    }

    tr { transition: var(--transition); }
    tr:hover td { background: var(--bg-3); }

    /* ====== STATUS BADGES ====== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .badge-pending { background: var(--warning-dim); color: var(--warning); border: 1px solid rgba(245,158,11,0.2); }
    .badge-active { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(59,130,246,0.2); }
    .badge-done { background: var(--success-dim); color: var(--success); border: 1px solid rgba(16,185,129,0.2); }
    .badge-error { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(239,68,68,0.2); }

    /* ====== PROGRESS BAR ====== */
    .progress-bar {
      width: 100%;
      height: 4px;
      background: var(--bg-4);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.6s ease;
    }

    /* ====== BUTTONS ====== */
    .btn {
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-approve { background: var(--success); color: white; }
    .btn-approve:hover { background: #059669; box-shadow: 0 0 20px rgba(16,185,129,0.3); }
    .btn-reject { background: var(--danger); color: white; }
    .btn-reject:hover { background: #dc2626; }
    .btn-outline { background: transparent; color: var(--text-2); border: 1px solid var(--border-2); }
    .btn-outline:hover { background: var(--bg-4); color: var(--text-0); }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #2563eb; }

    .actions { display: flex; gap: 5px; }

    /* ====== MODAL ====== */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--bg-2);
      border: 1px solid var(--border-2);
      border-radius: var(--radius-lg);
      padding: 2rem;
      width: 90%;
      max-width: 560px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .modal h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 8px; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--text-3); margin-bottom: 4px; font-weight: 500; }

    .form-control {
      width: 100%;
      padding: 9px 12px;
      background: var(--bg-3);
      border: 1px solid var(--border-2);
      border-radius: var(--radius-sm);
      color: var(--text-0);
      font-size: 0.85rem;
      font-family: inherit;
      transition: var(--transition);
    }

    .form-control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    textarea.form-control { min-height: 80px; resize: vertical; }

    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); }

    /* ====== TIMELINE ====== */
    .timeline { display: flex; align-items: center; gap: 0; margin: 1.5rem 0; overflow-x: auto; padding-bottom: 0.5rem; }

    .timeline-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 80px;
      position: relative;
    }

    .timeline-step::after {
      content: '';
      position: absolute;
      top: 16px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: var(--bg-4);
      z-index: 0;
    }

    .timeline-step:last-child::after { display: none; }

    .timeline-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      z-index: 1;
      border: 2px solid var(--bg-4);
      transition: var(--transition);
    }

    .timeline-step.done .timeline-dot { background: var(--success); border-color: var(--success); }
    .timeline-step.done::after { background: var(--success); }
    .timeline-step.current .timeline-dot { background: var(--accent); border-color: var(--accent); animation: pulse 2s infinite; }
    .timeline-step.current::after { background: linear-gradient(90deg, var(--accent), var(--bg-4)); }

    .timeline-label { font-size: 0.6rem; color: var(--text-3); margin-top: 6px; text-align: center; max-width: 70px; }

    /* ====== LOGIN ====== */
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-0) 0%, #0d1a2d 100%);
    }

    .login-card {
      background: var(--bg-2);
      border: 1px solid var(--border-2);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow);
    }

    .login-card h2 {
      text-align: center;
      margin-bottom: 0.25rem;
      font-size: 1.3rem;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-card .subtitle {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-3);
      margin-bottom: 2rem;
    }

    .login-error {
      background: var(--danger-dim);
      color: var(--danger);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      margin-bottom: 1rem;
      display: none;
    }

    /* ====== TOAST NOTIFICATIONS ====== */
    .toast-container {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      background: var(--bg-3);
      border: 1px solid var(--border-2);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 0.82rem;
      box-shadow: var(--shadow);
      animation: slideIn 0.3s ease;
      max-width: 360px;
    }

    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    .toast.warning { border-left-color: var(--warning); }

    @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

    /* ====== RESPONSIVE ====== */
    @media (max-width: 1200px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .content { padding: 1rem; }
      .table-wrap { overflow-x: auto; }
      table { min-width: 700px; }
    }
  </style>
</head>
<body>
  <!-- Login Page -->
  <div id="loginPage" class="login-page">
    <div class="login-card">
      <h2>🏛️ SIA Observa</h2>
      <p class="subtitle">Agente de Automatización — Gobernación del Cauca</p>
      <div id="loginError" class="login-error"></div>
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="admin@sia.local" value="admin@sia.local">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" value="admin123">
      </div>
      <button class="btn btn-primary" style="width:100%;padding:10px;margin-top:0.5rem;font-size:0.9rem" onclick="login()">
        Iniciar Sesión
      </button>
    </div>
  </div>

  <!-- App -->
  <div id="appPage" class="app" style="display:none">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h1>🏛️ SIA Observa</h1>
        <small>Agente Automatizado v2.0</small>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-item active" onclick="navigate('dashboard', this)">
          <span class="icon">📊</span> Dashboard
        </div>
        <div class="nav-item" onclick="navigate('solicitudes', this)">
          <span class="icon">📋</span> Solicitudes
          <span class="nav-badge" id="badgePendientes" style="display:none">0</span>
        </div>
        <div class="nav-item" onclick="navigate('colas', this)">
          <span class="icon">⚙️</span> Colas de Trabajo
        </div>
        <div class="nav-item" onclick="navigate('auditoria', this)">
          <span class="icon">📜</span> Auditoría
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-card">
          <div class="user-avatar" id="userAvatar">A</div>
          <div class="user-info">
            <div class="name" id="userName">Admin</div>
            <div class="role" id="userRole">Administrador</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="topbar">
        <h2 id="pageTitle">Dashboard</h2>
        <div class="live-indicator"><div class="live-dot"></div> Tiempo Real</div>
      </div>
      <div class="content" id="contentArea">
        <!-- Content loaded dynamically -->
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modalContent"></div>
  </div>

  <!-- Toasts -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/app.js"></script>
</body>
</html>
